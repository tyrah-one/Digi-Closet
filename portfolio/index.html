  <script>
    /* ==========================================================================
       YOUR CONTENT LIVES HERE
       --------------------------------------------------------------------------
       Edit SITE for your name, intro and contact details.
       Add, remove or reorder entries in PROJECTS to change your portfolio.

       Each project:
         id        – short unique slug used in the URL (no spaces), e.g. "fintech-app"
         title     – headline of the piece
         dek       – one-line subtitle under the headline (magazine "dek")
         category  – e.g. "Mobile App", "Web Platform", "Design System"
         year      – e.g. "2026"
         role      – what you did
         client    – company / course / "Personal project"
         tools     – array of tools, e.g. ["Figma", "Maze"]
         cover     – path to a cover image, e.g. "images/fintech-cover.jpg"
                     (leave "" to show an outlined placeholder)
         featured  – true puts this project on the "cover story" spot (use one)
         blurb     – 1–3 sentences shown on the cards on the home page
         story     – the full write-up; one string per paragraph.
                     Use { heading: "..." } for a section heading.
         pullQuote – a standout line, shown large in the article
         gallery   – images for the article: { src: "images/x.png", caption: "..." }
         links     – e.g. { label: "View prototype", url: "https://figma.com/..." }
       ========================================================================== */

    const SITE = {
      name: "Your Name",
      title: "UX / UI Designer",
      masthead: "Portfolio", // the big magazine logo at the top
      issue: "Vol. 01",
      tagline: "Thoughtful interfaces, made with care.",
      intro:
        "I design digital products that feel effortless — from research and strategy through to polished, pixel-perfect interfaces. Welcome to my edit of selected work.",
      about:
        "Write a few sentences about yourself here: where you're based, what kind of problems you love solving, and what you're looking for next. Keep it warm and personal — this is your editor's letter.",
      email: "hello@yourname.com",
      links: [
        { label: "LinkedIn", url: "https://www.linkedin.com/" },
        { label: "Dribbble", url: "https://dribbble.com/" },
        { label: "Resume", url: "#" },
      ],
    };

    const PROJECTS = [
      {
        id: "atelier-app",
        title: "Atelier",
        dek: "Reimagining how people plan, shop and style their wardrobe.",
        category: "Mobile App",
        year: "2026",
        role: "Lead UX/UI Designer",
        client: "Personal project",
        tools: ["Figma", "FigJam", "Maze", "Protopie"],
        cover: "",
        featured: true,
        blurb:
          "A wardrobe companion app that helps users mix and match the pieces they already own. I led research, information architecture and the visual system.",
        pullQuote: "The best outfit is usually already in your closet — the design job was helping people see it.",
        story: [
          { heading: "The brief" },
          "Replace this with the problem you set out to solve. Who were the users, what was frustrating them, and what did success look like?",
          { heading: "The process" },
          "Describe your research, the insights that shaped the direction, and the key decisions you made along the way. Mention interviews, competitive audits, journey maps, wireframes and testing rounds.",
          { heading: "The outcome" },
          "Share the final design and the results: metrics, user feedback, or what you learned. End with what you would do next.",
        ],
        gallery: [
          { src: "", caption: "Onboarding flow — add your screenshot path here" },
          { src: "", caption: "Outfit builder — high-fidelity screens" },
        ],
        links: [{ label: "View prototype", url: "#" }],
      },
      {
        id: "harvest-dashboard",
        title: "Harvest",
        dek: "A calmer analytics dashboard for small farm co-ops.",
        category: "Web Platform",
        year: "2025",
        role: "Product Designer",
        client: "Client name",
        tools: ["Figma", "Notion", "Hotjar"],
        cover: "",
        blurb:
          "Simplified a cluttered reporting tool into a focused dashboard, cutting time-to-insight for co-op managers in usability tests.",
        pullQuote: "Less data on screen, more decisions made.",
        story: [
          { heading: "The brief" },
          "Write about the challenge here.",
          { heading: "The outcome" },
          "Write about what you shipped and the impact.",
        ],
        gallery: [],
        links: [],
      },
      {
        id: "lumen-design-system",
        title: "Lumen",
        dek: "Building a design system that a team of twelve actually uses.",
        category: "Design System",
        year: "2025",
        role: "UI Designer",
        client: "Client name",
        tools: ["Figma", "Storybook", "Tokens Studio"],
        cover: "",
        blurb:
          "Components, tokens and documentation that brought consistency across three products and sped up handoff to engineering.",
        pullQuote: "A system is only as good as the people who adopt it.",
        story: ["Write your case study here."],
        gallery: [],

      },
      {
        id: "kin-health",
        title: "Kin",
        dek: "Designing a gentler appointment experience for family caregivers.",
        category: "UX Research",
        year: "2024",

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       Minimal black & white magazine theme.
       ========================================================================== */
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
      --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
      --max: 1240px;
      --gutter: clamp(16px, 4vw, 48px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; filter: grayscale(1); } /* delete the filter to show images in colour */
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--ink); color: var(--paper); }

    .kicker {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .read-more {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
      transition: color 0.2s;
    }
    .read-more:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }

    /* ---- Masthead ---------------------------------------------------------- */
    .masthead {
      max-width: var(--max);
      margin: 0 auto;
      padding: 18px var(--gutter) 0;
      text-align: center;
    }
    .masthead__meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      border-bottom: 1px solid var(--ink);
      padding-bottom: 10px;
    }
    .masthead__logo {
      display: block;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(3.4rem, 15vw, 11rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      padding: 12px 0 6px;
    }
    .masthead__nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 36px;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: 12px 0;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .masthead__nav a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }
    .masthead--slim .masthead__logo { font-size: clamp(2.4rem, 8vw, 4.5rem); padding-top: 4px; }

    /* ---- Placeholder visuals ----------------------------------------------- */
    .placeholder {
      width: 100%;
      height: 100%;
      min-height: 220px;
      display: grid;
      place-items: center;
      background: var(--paper);
      border: 1px solid var(--ink);
      color: var(--ink);
    }
    .placeholder span {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.6rem, 4vw, 3rem);
      padding: 0 1em;
      text-align: center;
    }

    /* ---- Cover ------------------------------------------------------------- */
    .cover {
      max-width: var(--max);
      margin: 0 auto;
      padding: clamp(32px, 6vw, 72px) var(--gutter);
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: clamp(28px, 5vw, 72px);
      align-items: stretch;
    }
    .cover__headline {
      font-family: var(--serif);
      font-weight: 500;
      font-style: italic;
      font-size: clamp(2.4rem, 5.4vw, 4.8rem);
      line-height: 1.02;
      letter-spacing: -0.01em;
      margin: 14px 0 22px;
    }
    .cover__intro {
      font-size: 1.05rem;
      color: var(--ink);
      max-width: 34em;
      margin: 0 0 36px;
    }
    .cover__story {
      display: grid;
      gap: 6px;
      border-top: 1px solid var(--ink);
      padding-top: 18px;
    }
    .cover__story-title {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 500;
      line-height: 1.1;
    }
    .cover__story-dek { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--ink); margin-bottom: 10px; }
    .cover__story .read-more { justify-self: start; }
    .cover__story:hover .cover__story-title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }

    .cover__image {
      position: relative;
      min-height: 460px;
      overflow: hidden;
    }
    .cover__image img, .cover__image .placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }
    .cover__image:hover img, .cover__image:hover .placeholder { transform: scale(1.03); }
    .cover__tag {
      position: absolute;
      left: 0;
      bottom: 0;
      background: var(--ink);
      color: var(--paper);
      padding: 10px 16px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ---- Contents ---------------------------------------------------------- */
    .contents {
      max-width: var(--max);
      margin: 0 auto;
      padding: 24px var(--gutter) 72px;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: 14px 0;
      margin-bottom: 8px;
    }
    .section-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
    }

    .toc { list-style: none; margin: 0 0 56px; padding: 0; columns: 2; column-gap: 48px; }
    .toc li { break-inside: avoid; border-bottom: 1px solid var(--ink); }
    .toc a {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      gap: 16px;
      padding: 14px 0;
    }
    .toc__num { font-family: var(--serif); font-size: 1.4rem; color: var(--ink); }
    .toc__title { font-family: var(--serif); font-size: 1.3rem; font-weight: 400; }
    .toc__cat { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); }
    .toc a:hover .toc__title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 56px 40px;
    }
    .card { display: grid; gap: 20px; align-content: start; }
    .card__image { display: block; overflow: hidden; aspect-ratio: 4 / 3; }
    .card__image img, .card__image .placeholder {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s ease;
    }
    .card:hover .card__image img, .card:hover .card__image .placeholder { transform: scale(1.04); }
    .card__title {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 500;
      line-height: 1.05;
      margin: 8px 0 6px;
    }
    .card__title a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }
    .card__dek { font-family: var(--serif); font-style: italic; font-size: 1.15rem; margin: 0 0 10px; }
    .card__blurb { color: var(--ink); margin: 0 0 16px; }

    .card--wide {
      grid-column: 1 / -1;
      grid-template-columns: 1.4fr 1fr;
      align-items: center;
      gap: 40px;
    }
    .card--wide .card__image { aspect-ratio: 16 / 10; }
    .card--wide:nth-child(even) .card__image { order: 2; }

    /* ---- Editor's letter --------------------------------------------------- */
    .letter {
      border-top: 1px solid var(--ink);
      padding: clamp(48px, 8vw, 104px) var(--gutter);
      text-align: center;
    }
    .letter__body {
      max-width: 760px;
      margin: 20px auto 24px;
      font-family: var(--serif);
      font-size: clamp(1.25rem, 2.4vw, 1.7rem);
      line-height: 1.5;
      text-align: left;
    }
    .letter__sign { font-family: var(--serif); font-style: italic; font-size: 1.3rem; margin: 0; }

    .dropcap::first-letter {
      float: left;
      font-family: var(--serif);
      font-weight: 400;
      font-size: 4.4em;
      line-height: 0.82;
      padding: 0.06em 0.1em 0 0;
      color: var(--ink);
    }
    .letter__body.dropcap::first-letter { font-size: 3.6em; }

    /* ---- Footer ------------------------------------------------------------ */
    .footer {
      background: var(--ink);
      color: var(--paper);
      text-align: center;
      padding: 72px var(--gutter) 32px;
    }
    .footer .kicker { display: block; color: var(--paper); }
    .footer__email {
      display: inline-block;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.8rem, 6vw, 4rem);
      margin: 12px 0 28px;
      overflow-wrap: anywhere;
    }
    .footer__email:hover, .footer__links a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }
    .footer__links {
      list-style: none; padding: 0; margin: 0 0 48px;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 32px;
      font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
    }
    .footer__fine { font-size: 0.72rem; color: var(--paper); letter-spacing: 0.1em; margin: 0; }

    /* ---- Article ----------------------------------------------------------- */
    .article { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter) 80px; }
    .article__header { text-align: center; padding: clamp(40px, 7vw, 80px) 0 40px; max-width: 900px; margin: 0 auto; }
    .article__title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(3rem, 10vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin: 16px 0 20px;
    }
    .article__dek { font-family: var(--serif); font-style: italic; font-size: clamp(1.2rem, 2.4vw, 1.6rem); color: var(--ink); margin: 0; }
    .article__hero { aspect-ratio: 16 / 8; overflow: hidden; }
    .article__hero img, .article__hero .placeholder { width: 100%; height: 100%; object-fit: cover; }

    .article__layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 680px);
      justify-content: center;
      gap: clamp(32px, 6vw, 96px);
      padding-top: 56px;
    }
    .credits { position: sticky; top: 24px; align-self: start; border-top: 1px solid var(--ink); padding-top: 16px; }
    .credits dl { margin: 0; }
    .credits dt { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); }
    .credits dd { margin: 2px 0 18px; font-family: var(--serif); font-size: 1.05rem; }
    .credits__links { display: grid; gap: 10px; margin-top: 8px; }
    .button {
      display: inline-block;
      border: 1px solid var(--ink);
      padding: 10px 16px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .button:hover { background: var(--ink); color: var(--paper); }

    .article__body { font-size: 1.08rem; line-height: 1.8; }
    .article__body p { margin: 0 0 1.4em; }
    .article__lede { font-family: var(--serif); font-size: 1.45rem; line-height: 1.5; border-bottom: 1px solid var(--ink); padding-bottom: 1.2em; }
    .article__h { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.9rem; margin: 1.6em 0 0.5em; }
    .pullquote {
      margin: 1.6em -0.5em;
      padding: 0.8em 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.6rem, 3.4vw, 2.3rem);
      line-height: 1.25;
      color: var(--ink);
      text-align: center;
    }

    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; padding-top: 56px; }
    .gallery__item { margin: 0; }
    .gallery__item:nth-child(3n + 1),
    .gallery__item:last-child:nth-child(3n + 2) { grid-column: 1 / -1; }
    .gallery__item .placeholder { aspect-ratio: 16 / 9; }
    .gallery figcaption { font-size: 0.82rem; color: var(--ink); padding-top: 10px; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }

    .next {
      display: grid;
      gap: 6px;
      text-align: center;
      margin-top: 80px;
      padding: 48px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }
    .next__title { font-family: var(--serif); font-weight: 500; font-size: clamp(2.4rem, 7vw, 5rem); line-height: 1; }
    .next__dek { font-family: var(--serif); font-style: italic; color: var(--ink); font-size: 1.2rem; }
    .next:hover .next__title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.12em; }

    .notfound { text-align: center; padding: 120px var(--gutter); }
    .notfound h1 { font-family: var(--serif); font-style: italic; font-size: 3rem; }

    /* ---- Responsive -------------------------------------------------------- */
    @media (max-width: 860px) {
      .cover { grid-template-columns: 1fr; }
      .cover__image { min-height: 360px; order: -1; }
      .toc { columns: 1; }
      .grid { grid-template-columns: 1fr; }
      .card--wide { grid-template-columns: 1fr; gap: 20px; }
      .card--wide:nth-child(even) .card__image { order: 0; }
      .article__layout { grid-template-columns: 1fr; padding-top: 36px; }
      .credits { position: static; }
      .credits dl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
      .gallery { grid-template-columns: 1fr; }
      .pullquote { margin-left: 0; margin-right: 0; }
    }
    @media (max-width: 520px) {
      .masthead__meta span:nth-child(2) { display: none; }
      .toc__cat { display: none; }
      .article__hero { aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <header class="masthead" id="masthead"></header>
  <main id="app"></main>
  <footer class="footer" id="contact"></footer>

  <script>
    /* Renders the site from SITE and PROJECTS (top of this file).
       You shouldn't need to edit this script to add content. */
    (function () {
      const $ = (sel) => document.querySelector(sel);
      const pad = (n) => String(n).padStart(2, "0");

      function esc(str) {
        return String(str ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      // Image, or an outlined placeholder when no image is set.
      function visual(src, alt, label) {
        if (src) return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" />`;
        return `<div class="placeholder">
          <span>${esc(label || alt)}</span></div>`;
      }

      const projectUrl = (p) => `#project-${encodeURIComponent(p.id)}`;

      // ---- Shared chrome -------------------------------------------------------
      function renderMasthead(slim) {
        const today = new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" });
        const head = $("#masthead");
        head.className = slim ? "masthead masthead--slim" : "masthead";
        head.innerHTML = `
          ${slim ? "" : `<div class="masthead__meta">
            <span>${esc(SITE.issue)}</span><span>${esc(SITE.title)}</span><span>${today}</span>
          </div>`}
          <a href="#" class="masthead__logo">${esc(SITE.masthead)}</a>
          <nav class="masthead__nav">
            ${slim ? `<a href="#work">← All Work</a>` : `<a href="#work">The Work</a><a href="#about">Editor's Letter</a>`}
            <a href="#contact">Contact</a>
          </nav>`;
      }

      function renderFooter() {
        $("#contact").innerHTML = `
          <p class="kicker">Get in touch</p>
          <a class="footer__email" href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>
          <ul class="footer__links">${(SITE.links || []).map((l) =>
            `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("")}</ul>
          <p class="footer__fine">© ${new Date().getFullYear()} ${esc(SITE.name)}</p>`;
      }

      // ---- Home ----------------------------------------------------------------
      function renderHome() {
        document.title = `${SITE.name} — ${SITE.title}`;
        renderMasthead(false);
        const feature = PROJECTS.find((p) => p.featured) || PROJECTS[0];

        const cover = `
          <section class="cover">
            <div class="cover__text">
              <span class="kicker">${esc(SITE.title)}</span>
              <h1 class="cover__headline">${esc(SITE.tagline)}</h1>
              <p class="cover__intro">${esc(SITE.intro)}</p>
              ${feature ? `
              <a class="cover__story" href="${projectUrl(feature)}">
                <span class="kicker kicker--accent">Cover Story</span>
                <span class="cover__story-title">${esc(feature.title)}</span>
                <span class="cover__story-dek">${esc(feature.dek)}</span>
                <span class="read-more">Read the case study →</span>
              </a>` : ""}
            </div>
            ${feature ? `
            <a class="cover__image" href="${projectUrl(feature)}">
              ${visual(feature.cover, feature.title, feature.title)}
              <span class="cover__tag">${esc(feature.category)} · ${esc(feature.year)}</span>
            </a>` : ""}
          </section>`;

        const toc = PROJECTS.map((p, i) => `
          <li><a href="${projectUrl(p)}">
            <span class="toc__num">${pad(i + 1)}</span>
            <span class="toc__title">${esc(p.title)}</span>
            <span class="toc__cat">${esc(p.category)}</span>
          </a></li>`).join("");

        const cards = PROJECTS.map((p, i) => `
          <article class="card ${i % 3 === 0 ? "card--wide" : ""}">
            <a href="${projectUrl(p)}" class="card__image">
              ${visual(p.cover, p.title, p.title)}
            </a>
            <div class="card__body">
              <span class="kicker">${pad(i + 1)} — ${esc(p.category)}</span>
              <h3 class="card__title"><a href="${projectUrl(p)}">${esc(p.title)}</a></h3>
              <p class="card__dek">${esc(p.dek)}</p>
              <p class="card__blurb">${esc(p.blurb)}</p>
              <a class="read-more" href="${projectUrl(p)}">Read more →</a>
            </div>
          </article>`).join("");

        $("#app").innerHTML = `
          ${cover}
          <section class="contents" id="work">
            <div class="section-head">
              <span class="kicker">In this issue</span>
              <h2>Selected Work</h2>
            </div>
            <ol class="toc">${toc}</ol>
            <div class="grid">${cards}</div>
          </section>
          <section class="letter" id="about">
            <span class="kicker">Editor's Letter</span>
            <p class="letter__body dropcap">${esc(SITE.about)}</p>
            <p class="letter__sign">— ${esc(SITE.name)}</p>
          </section>`;
      }

      // ---- Project / article ---------------------------------------------------
      function renderProject(id) {
        renderMasthead(true);
        const index = PROJECTS.findIndex((p) => p.id === id);
        const p = PROJECTS[index];

        if (!p) {
          $("#app").innerHTML = `<section class="notfound"><h1>Story not found</h1>
            <p><a class="read-more" href="#work">Back to all work →</a></p></section>`;
          return;
        }
        document.title = `${p.title} — ${SITE.name}`;

        let firstPara = true;
        const story = (p.story || []).map((block) => {
          if (block && typeof block === "object" && block.heading) {
            return `<h2 class="article__h">${esc(block.heading)}</h2>`;
          }
          const cls = firstPara ? ' class="dropcap"' : "";
          firstPara = false;
          return `<p${cls}>${esc(block)}</p>`;
        });

        // Drop the pull quote in after the second story block.
        if (p.pullQuote) {
          story.splice(Math.min(2, story.length), 0,
            `<blockquote class="pullquote">“${esc(p.pullQuote)}”</blockquote>`);
        }

        const gallery = (p.gallery || []).map((g) => `
          <figure class="gallery__item">
            ${visual(g.src, g.caption, "Image")}
            ${g.caption ? `<figcaption>${esc(g.caption)}</figcaption>` : ""}
          </figure>`).join("");

        const links = (p.links || []).map((l) =>
          `<a class="button" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("");

        const next = PROJECTS[(index + 1) % PROJECTS.length];

        $("#app").innerHTML = `
          <article class="article">
            <header class="article__header">
              <span class="kicker kicker--accent">${esc(p.category)} · ${esc(p.year)}</span>
              <h1 class="article__title">${esc(p.title)}</h1>
              <p class="article__dek">${esc(p.dek)}</p>
            </header>

            <div class="article__hero">${visual(p.cover, p.title, p.title)}</div>

            <div class="article__layout">
              <aside class="credits">
                <dl>
                  <dt>Role</dt><dd>${esc(p.role)}</dd>
                  <dt>Client</dt><dd>${esc(p.client)}</dd>
                  <dt>Year</dt><dd>${esc(p.year)}</dd>
                  ${p.tools && p.tools.length ? `<dt>Tools</dt><dd>${p.tools.map(esc).join(", ")}</dd>` : ""}
                </dl>
                ${links ? `<div class="credits__links">${links}</div>` : ""}
              </aside>
              <div class="article__body">
                <p class="article__lede">${esc(p.blurb)}</p>
                ${story.join("")}
              </div>
            </div>

            ${gallery ? `<section class="gallery">${gallery}</section>` : ""}

            ${next && next !== p ? `
            <a class="next" href="${projectUrl(next)}">
              <span class="kicker">Next story</span>
              <span class="next__title">${esc(next.title)}</span>
              <span class="next__dek">${esc(next.dek)}</span>
            </a>` : ""}
          </article>`;
      }

      // ---- Routing: "#project-<id>" opens a case study, anything else is home ----
      function route() {
        const hash = decodeURIComponent(location.hash.slice(1));
        if (hash.startsWith("project-")) {
          renderProject(hash.slice("project-".length));
          window.scrollTo(0, 0);
          return;
        }
        renderHome();
        const target = hash && document.getElementById(hash);
        if (target) target.scrollIntoView();
        else window.scrollTo(0, 0);
      }

      renderFooter();
      window.addEventListener("hashchange", route);
      route();
    })();
  </script>
</body>
</html>
