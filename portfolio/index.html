  <style>
    /* Same look as the Digi Closet site: thin lines, square corners,
       a fashion-magazine serif for headings and a clean sans for everything else.
       Colours come from the Resene palette used on Digi Closet. */
    :root {
      /* The palette */
      --kina-brown: #413b38;
      --half-alabaster: #fdfdfc;
      --kensington-grey: #9c9e98;
      --swiss-caramel: #ac7548;
      --weathered-yellow: #e4daa2;
      --wimbledon: #4f6f37;
      --burgundy: #6c2b2b;
      --mantis: #88bf4d;
      --lemon-ginger: #978732;

      /* What each colour is used for */
      --paper: var(--half-alabaster); /* page background */
      --white: #ffffff; /* image frames, so screenshots look true to colour */
      --ink: var(--kina-brown); /* main text, buttons, title */
      --grey: color-mix(in srgb, var(--kina-brown) 70%, var(--half-alabaster)); /* quiet text */
      --line: color-mix(in srgb, var(--kensington-grey) 45%, var(--half-alabaster)); /* thin borders */
      --accent: var(--swiss-caramel); /* link underlines, hovers */
      --highlight: color-mix(in srgb, var(--weathered-yellow) 35%, var(--half-alabaster)); /* soft hover fill */

      --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
      --sans: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
      --display: "Archivo Black", "Arial Black", Impact, sans-serif; /* big home title only */
    }

    /* ---------- Basics ---------- */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--sans);
      font-weight: 300;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--paper);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 16px 64px;
    }

    img { display: block; max-width: 100%; }

    h1, h2, h3 { font-weight: 400; text-wrap: balance; }

    h1 {
      margin: 0 0 24px;
      font-family: var(--serif);
      font-size: 2.6rem;
      line-height: 1.1;
    }

    /* Section headings are small spaced-out capitals */
    h2 {
      margin: 56px 0 16px;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    a { color: var(--ink); }
    strong { font-weight: 500; }
    .muted { color: var(--grey); }

    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* Small spaced-out capitals, used for labels */
    .label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--grey);
    }

    /* ---------- Buttons (links that look like Digi Closet buttons) ---------- */
    .button {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 20px;
      border: 1px solid var(--ink);
      color: var(--ink);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .button:hover { background: var(--ink); color: var(--paper); }

    .button.primary { background: var(--ink); color: var(--paper); }
    .button.primary:hover { background: var(--accent); border-color: var(--accent); }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ---------- Navigation bar ---------- */
    .nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 32px;
      padding: 12px 24px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .nav a { color: var(--ink); text-decoration: none; }

    .nav .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      font-family: var(--serif);
      font-size: 1.1rem;
    }

    /* The logo picture in the top bar */
    .nav .logo img { height: 56px; width: auto; }

    .nav nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 48px;
    }

    /* Page links use the serif, like on Digi Closet */
    .nav nav a {
      font-family: var(--serif);
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
    }

    .nav nav a:hover,
    .nav nav a.active { border-bottom-color: var(--accent); }

    /* ---------- Home: big title ---------- */
    .home-intro {
      text-align: center;
      --title-gap: max(24px, 5vw); /* space between the big title and the screen edges */
    }

    /* Big title that stretches almost edge to edge (its size is fitted by the script) */
    .home-intro h1 {
      margin-inline: calc(50% - 50vw + var(--title-gap));
      margin-block: 8px 20px;
      font-family: var(--display);
      font-size: 12vw;
      line-height: 1;
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* The logo standing in for an O in the title, sized to the capital letters */
    .title-logo {
      display: inline-block;
      height: 0.76em;
      width: auto;
      margin-inline: 0.02em;
      vertical-align: baseline;
    }

    .home-intro p { margin: 0 0 8px; }
    .home-intro .tagline { font-size: 1.1rem; letter-spacing: 0.04em; }

    .home-intro .intro {
      max-width: 36em;
      margin: 24px auto 0;
      color: var(--grey);
    }

    /* ---------- Home: work grid (boxes share their thin lines, like Digi Closet) ---------- */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .work-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      padding: 24px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      transition: background 0.15s;
    }

    .work-card:hover { background: var(--highlight); }

    /* The cover story spans the whole row, picture beside text */
    .work-card.featured {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      align-items: center;
      gap: 32px;
    }

    .work-card .frame { margin-bottom: 14px; }
    .work-card.featured .frame { margin-bottom: 0; }

    .work-card h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .work-card.featured h3 { font-size: 2.2rem; }

    .work-card .dek { margin: 0; color: var(--grey); font-size: 0.95rem; }
    .work-card .blurb { margin: 6px 0 0; font-size: 0.95rem; }

    .work-card .more {
      margin-top: 12px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      align-self: flex-start;
      border-bottom: 1px solid var(--accent);
    }

    /* Small colour swatch in front of each category, like the Digi Closet categories */
    .category {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .category::before {
      content: "";
      flex: none;
      width: 10px;
      height: 10px;
      background: var(--swatch, var(--accent));
    }

    /* ---------- Image frames (white, thin border) ---------- */
    .frame {
      aspect-ratio: 16 / 10; /* the shape of a laptop screenshot */
      max-width: 100%;
      background: var(--white);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    /* Pictures fill the frame, cropped from the top (keeps the top of screenshots in view) */
    .frame img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

    .frame.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    /* ---------- Home: about + contact ---------- */
    .about p {
      max-width: 40em;
      margin: 0;
      font-family: var(--serif);
      font-size: 1.35rem;
      line-height: 1.5;
    }

    .contact .email {
      display: inline-block;
      margin-bottom: 20px;
      font-family: var(--serif);
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 64px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    /* ---------- Project page ---------- */
    .back {
      display: inline-block;
      margin-bottom: 32px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .back:hover { border-bottom-color: var(--accent); }

    .project-header { margin-bottom: 32px; }
    .project-header .category { margin-bottom: 12px; }
    .project-header h1 { margin-bottom: 8px; font-size: clamp(2.6rem, 7vw, 4rem); }
    .project-header .dek { margin: 0; font-size: 1.15rem; color: var(--grey); }

    .project-hero.frame { aspect-ratio: 16 / 9; }

    .project-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 48px;
      margin-top: 40px;
    }

    .credits dl { margin: 0; }
    .credits dt { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--grey); }
    .credits dd { margin: 2px 0 18px; }
    .credits .button-row { flex-direction: column; align-items: flex-start; }

    .story { max-width: 40em; }
    .story h2:first-of-type { margin-top: 40px; }
    .story p { margin: 0 0 1.2em; }

    .lede {
      font-family: var(--serif);
      font-size: 1.35rem;
      line-height: 1.5;
    }

    .pullquote {
      margin: 40px 0;
      padding: 24px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-family: var(--serif);
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      line-height: 1.3;
    }

    .pullquote::before { content: "“"; color: var(--accent); }
    .pullquote::after { content: "”"; color: var(--accent); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
      align-items: start;
      gap: 32px 24px;
    }

    .gallery figure { margin: 0; }

    /* Gallery pictures are shown whole, at their own shape */
    .gallery .frame:not(.empty) { aspect-ratio: auto; }
    .gallery .frame img { height: auto; }
    .gallery figcaption { margin-top: 8px; font-size: 0.85rem; color: var(--grey); }

    .next {
      margin-top: 64px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .not-found { padding: 48px 24px; text-align: center; border: 1px solid var(--line); }

    /* ---------- Smaller screens ---------- */
    @media (max-width: 760px) {
      .work-card.featured { grid-template-columns: 1fr; gap: 0; }
      .work-card.featured .frame { margin-bottom: 14px; }
      .work-card.featured h3 { font-size: 1.8rem; }
      .project-layout { grid-template-columns: 1fr; gap: 8px; }
      .nav nav { gap: 8px 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>

      // Colour swatches from the palette, given out to categories in order
      const SWATCHES = ["var(--burgundy)", "var(--wimbledon)", "var(--lemon-ginger)", "var(--swiss-caramel)", "var(--mantis)", "var(--kensington-grey)"];
      const categories = [...new Set(PROJECTS.map((p) => p.category))];
      const swatch = (category) => SWATCHES[categories.indexOf(category) % SWATCHES.length];

      // If a picture can't be found, show the empty frame instead of a broken image
      window.missingImage = (img) => {
        const box = img.parentNode;
        box.classList.add("empty");
        box.innerHTML = `<span class="label">Image not found</span>`;
      };

      function esc(str) {
        return String(str ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      // A picture in a white frame, or an empty frame when there's no picture yet
      function frame(src, alt, extraClass = "") {
        if (src) return `<div class="frame ${extraClass}"><img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="missingImage(this)" /></div>`;
        return `<div class="frame empty ${extraClass}"><span class="label">Add image</span></div>`;
      }

      const categoryLabel = (p) =>
        `<span class="category" style="--swatch:${swatch(p.category)}">${esc(p.category)} · ${esc(p.year)}</span>`;

      const projectUrl = (p) => `#project-${encodeURIComponent(p.id)}`;

      // ---- Top bar ----
      function renderNav(active) {
        $("#nav").innerHTML = `
          <a href="#" class="logo">
            ${logo ? `<img src="${esc(logo)}" alt="" />` : ""}
            <span>${esc(SITE.name)}</span>
          </a>
          <nav>
            <a href="#work" class="${active === "work" ? "active" : ""}">Work</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
          </nav>`;
      }

      // ---- Big title: one O is swapped for the logo, then the title is sized to fit ----
      function titleHtml(text) {
        const upper = text.toUpperCase();
        const os = [...upper].map((c, i) => (c === "O" ? i : -1)).filter((i) => i >= 0);
        if (!logo || !os.length) return esc(upper);
        // Use the O closest to the middle of the word
        const middle = (upper.length - 1) / 2;
        const at = os.reduce((a, b) => (Math.abs(b - middle) < Math.abs(a - middle) ? b : a));
        return `${esc(upper.slice(0, at))}<img class="title-logo" src="${esc(logo)}" alt="" />${esc(upper.slice(at + 1))}`;
      }

      function fitTitle() {
        const h1 = $(".home-intro h1");
        const text = $(".home-intro h1 .fit");
        if (!h1 || !text) return;
        const gap = Math.max(24, window.innerWidth * 0.05);
        const target = document.documentElement.clientWidth - 2 * gap;
        h1.style.fontSize = "100px";
        const width = text.getBoundingClientRect().width;
        if (width) h1.style.fontSize = `${Math.min(100 * (target / width), 260)}px`;
      }

      // ---- Home page ----
      function renderHome() {
        document.title = `${SITE.name} — ${SITE.title}`;
        renderNav("work");
        const featured = PROJECTS.find((p) => p.featured) || PROJECTS[0];
        const ordered = featured ? [featured, ...PROJECTS.filter((p) => p !== featured)] : [];

        const cards = ordered.map((p) => `
          <a class="work-card ${p === featured ? "featured" : ""}" href="${projectUrl(p)}">
            ${frame(p.cover, p.title)}
            <div>
              ${categoryLabel(p)}
              <h3>${esc(p.title)}</h3>
              <p class="dek">${esc(p.dek)}</p>
              <p class="blurb">${esc(p.blurb)}</p>
              <span class="more">View project</span>
            </div>
          </a>`).join("");

        $("#app").innerHTML = `
          <section class="home-intro">
            <h1 aria-label="${esc(SITE.masthead)}"><span class="fit">${titleHtml(SITE.masthead)}</span></h1>
            <p class="tagline">${esc(SITE.tagline)}</p>
            <p class="label">${esc(SITE.title)} · ${PROJECTS.length} projects</p>
            <p class="intro">${esc(SITE.intro)}</p>
          </section>

          <section id="work">
            <h2>Selected work</h2>
            <div class="work-grid">${cards}</div>
          </section>

          <section class="about" id="about">
            <h2>About</h2>
            <p>${esc(SITE.about)}</p>
          </section>

          <section class="contact" id="contact">
            <h2>Contact</h2>
            <a class="email" href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>
            <div class="button-row">${(SITE.links || []).map((l) =>
              `<a class="button" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>
          </section>

          <p class="footer label">© ${new Date().getFullYear()} ${esc(SITE.name)}</p>`;

        fitTitle();
        if (document.fonts) document.fonts.ready.then(fitTitle);
      }

      // ---- Project page ----
      function renderProject(id) {
        renderNav("work");
        const index = PROJECTS.findIndex((p) => p.id === id);
        const p = PROJECTS[index];

        if (!p) {
          $("#app").innerHTML = `<p class="not-found">That project isn't here. <a href="#work">See all work</a>.</p>`;
          return;
        }
        document.title = `${p.title} — ${SITE.name}`;

        // Story: strings are paragraphs, { heading } items are section headings
        const story = (p.story || []).map((block) =>
          block && typeof block === "object" && block.heading
            ? `<h2>${esc(block.heading)}</h2>`
            : `<p>${esc(block)}</p>`);

        // The pull quote goes in after the second story block
        if (p.pullQuote) {
          story.splice(Math.min(2, story.length), 0, `<blockquote class="pullquote">${esc(p.pullQuote)}</blockquote>`);
        }

        const gallery = (p.gallery || []).map((g) => `
          <figure>
            ${frame(g.src, g.caption)}
            ${g.caption ? `<figcaption>${esc(g.caption)}</figcaption>` : ""}
          </figure>`).join("");

        const links = (p.links || []).map((l) =>
          `<a class="button primary" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");

        const next = PROJECTS[(index + 1) % PROJECTS.length];

        $("#app").innerHTML = `
          <a class="back" href="#work">← All work</a>

          <header class="project-header">
            ${categoryLabel(p)}
            <h1>${esc(p.title)}</h1>
            <p class="dek">${esc(p.dek)}</p>
          </header>

          ${frame(p.cover, p.title, "project-hero")}

          <div class="project-layout">
            <aside class="credits">
              <dl>
                <dt>Role</dt><dd>${esc(p.role)}</dd>
                <dt>Client</dt><dd>${esc(p.client)}</dd>
                <dt>Year</dt><dd>${esc(p.year)}</dd>
                ${p.tools && p.tools.length ? `<dt>Tools</dt><dd>${p.tools.map(esc).join(", ")}</dd>` : ""}
              </dl>
              ${links ? `<div class="button-row">${links}</div>` : ""}
            </aside>
            <div class="story">
              <p class="lede">${esc(p.blurb)}</p>
              ${story.join("")}
            </div>
          </div>

          ${gallery ? `<h2>Gallery</h2><div class="gallery">${gallery}</div>` : ""}

          ${next && next !== p ? `
          <div class="next">
            <a class="work-card" href="${projectUrl(next)}">
              <span class="label">Next project</span>
              <h3>${esc(next.title)}</h3>
              <p class="dek">${esc(next.dek)}</p>
            </a>
          </div>` : ""}`;
      }

      // ---- Which page to show: "#project-<id>" opens a project, anything else is home ----
      function route() {
        const hash = decodeURIComponent(location.hash.slice(1));
        if (hash.startsWith("project-")) {
          renderProject(hash.slice("project-".length));
          window.scrollTo(0, 0);
          return;
        }
        renderHome();
        const target = hash && document.getElementById(hash);
        if (target) target.scrollIntoView();
        else window.scrollTo(0, 0);
      }

      window.addEventListener("hashchange", route);
      window.addEventListener("resize", fitTitle);
      route();
    })();
  </script>
</body>
</html>
